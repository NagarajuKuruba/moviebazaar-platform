app: gateway-service
custom:
    message: "Hello from Gateway Service!"
server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/auth/**
        - id: movie-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/movies/**
        - id: theatre-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/theatres/**
        - id: show-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/shows/**
        - id: booking-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/bookings/**
        - id: payment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/payments/**